<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a Plan - TamGam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/branding.js"></script>
  <style>
    :root {
      --saffron: #e8640c;
      --saffron-dk: #c04f06;
      --ink: #1a1a2e;
      --gold: #d4a017;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--ink); color: #fff; min-height: 100vh; }
    nav { padding: 20px 5vw; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.08); }
    .nav-logo { color: #fff; text-decoration: none; font-weight: 700; }
    .nav-back { color: rgba(255,255,255,.65); text-decoration: none; font-size: .9rem; }
    .page { max-width: 1120px; margin: 0 auto; padding: 48px 5vw 72px; }
    .page-header { text-align: center; margin-bottom: 40px; }
    .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 3.8vw, 3rem); margin-bottom: 10px; }
    .page-sub { color: rgba(255,255,255,.68); max-width: 620px; margin: 0 auto; line-height: 1.6; }
    .billing-toggle { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 30px; }
    .current-plan { margin: 0 auto 18px; max-width: 620px; border: 1px solid rgba(16,185,129,.4); background: rgba(16,185,129,.12); color: #d1fae5; border-radius: 10px; padding: 10px 12px; text-align: center; font-size: .9rem; font-weight: 600; }
    .toggle-label { color: rgba(255,255,255,.55); }
    .toggle-label.active { color: #fff; }
    .toggle-track { width: 48px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); cursor: pointer; position: relative; }
    .toggle-track.on { background: var(--saffron); border-color: var(--saffron); }
    .toggle-thumb { position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle-track.on .toggle-thumb { transform: translateX(22px); }
    .save-pill { color: #6ee7b7; border: 1px solid rgba(110,231,183,.35); background: rgba(110,231,183,.12); border-radius: 999px; padding: 3px 10px; font-size: .75rem; }
    .loading-state, .error-state { text-align: center; color: rgba(255,255,255,.7); padding: 50px 20px; }
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 16px; }
    .plan-card { background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px 20px; cursor: pointer; position: relative; transition: .2s; }
    .plan-card:hover { transform: translateY(-2px); border-color: rgba(232,100,12,.45); }
    .plan-card.selected { border-color: var(--saffron); box-shadow: 0 0 0 2px rgba(232,100,12,.2); }
    .plan-card.active-plan { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,.22); }
    .plan-card.popular.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,160,23,.25); }
    .popular-badge { position: absolute; top: 12px; right: 12px; background: var(--gold); color: #1a1a2e; border-radius: 6px; padding: 3px 8px; font-size: .68rem; font-weight: 800; text-transform: uppercase; }
    .active-badge { position: absolute; top: 12px; left: 12px; background: #10b981; color: #052e26; border-radius: 6px; padding: 3px 8px; font-size: .68rem; font-weight: 800; text-transform: uppercase; }
    .selected-check { position: absolute; top: 12px; left: 12px; opacity: 0; }
    .plan-card.selected .selected-check { opacity: 1; }
    .plan-card.active-plan .selected-check { left: 98px; }
    .plan-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 6px; }
    .plan-desc { color: rgba(255,255,255,.6); font-size: .86rem; line-height: 1.5; margin-bottom: 14px; min-height: 42px; }
    .price-amount { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 2px; }
    .price-amount small { font-family: 'DM Sans', sans-serif; font-size: .85rem; color: rgba(255,255,255,.65); }
    .price-annual { color: rgba(255,255,255,.55); font-size: .78rem; margin-bottom: 12px; }
    .plan-divider { height: 1px; background: rgba(255,255,255,.1); margin: 12px 0; }
    .plan-features { list-style: none; }
    .plan-features li { display: flex; gap: 8px; color: rgba(255,255,255,.78); font-size: .83rem; margin: 6px 0; }
    .feat-icon { color: #f5914a; }
    .actions { margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pay-btn { border: none; border-radius: 10px; background: var(--saffron); color: #fff; font-weight: 700; padding: 12px 20px; min-width: 240px; cursor: pointer; }
    .pay-btn:hover { background: var(--saffron-dk); }
    .pay-btn:disabled { opacity: .55; cursor: not-allowed; }
    .cancel-btn { border: 1px solid rgba(253,164,175,.45); border-radius: 10px; background: rgba(190,24,93,.14); color: #fecdd3; font-weight: 700; padding: 10px 18px; min-width: 240px; cursor: pointer; }
    .cancel-btn:hover { background: rgba(190,24,93,.2); }
    .cancel-btn:disabled { opacity: .55; cursor: not-allowed; }
    .action-msg { color: #86efac; font-size: .88rem; }
    .action-err { color: #fda4af; font-size: .88rem; }
  </style>
</head>
<body x-data x-init="Guards.requireLogin()">
  <nav>
    <a href="/" class="nav-logo">
      <span style="display:inline-flex;align-items:center;gap:8px;">
        <img src="/logo.png" alt="TamGam" style="width:26px;height:26px;object-fit:contain;">
        <span>TamGam</span>
      </span>
    </a>
    <a href="/dashboard.html" class="nav-back">Back to dashboard</a>
  </nav>

  <div class="page" x-data="plansData()" x-init="init()">
    <div class="page-header">
      <h1 class="page-title">Choose your learning plan</h1>
      <p class="page-sub">Active plans are loaded from your configured subscription catalog.</p>
    </div>

    <div class="billing-toggle">
      <span class="toggle-label" :class="{ active: billing === 'monthly' }">Monthly</span>
      <div class="toggle-track" :class="{ on: billing === 'annual' }" @click="billing = billing === 'monthly' ? 'annual' : 'monthly'">
        <div class="toggle-thumb"></div>
      </div>
      <span class="toggle-label" :class="{ active: billing === 'annual' }">Annual</span>
      <span class="save-pill" x-show="billing === 'annual'">Annual pricing</span>
    </div>
    <div class="current-plan" x-show="currentSubscription?.is_subscribed" x-text="`Active plan: ${currentSubscription?.plan_name || 'Active'} (${currentSubscription?.billing_cycle || 'monthly'})`"></div>
    <div class="current-plan" x-show="currentSubscription?.cancel_at_period_end" x-text="`Cancellation scheduled for ${currentSubscription?.current_period_end ? new Date(currentSubscription.current_period_end).toLocaleDateString('en-IN') : 'period end'}.`"></div>

    <template x-if="loading">
      <div class="loading-state">Loading plans...</div>
    </template>

    <template x-if="!loading && error">
      <div class="error-state" x-text="error"></div>
    </template>

    <div class="plans-grid" x-show="!loading && !error && plans.length">
      <template x-for="plan in plans" :key="plan.id">
        <div class="plan-card" :class="{ selected: selectedPlanId === plan.id, popular: (plan.slug || '').toLowerCase() === 'standard', 'active-plan': isCurrentPlan(plan) }" @click="selectedPlanId = plan.id">
          <div class="popular-badge" x-show="(plan.slug || '').toLowerCase() === 'standard'">Most Popular</div>
          <div class="active-badge" x-show="isCurrentPlan(plan)">Active</div>
          <div class="selected-check">✓</div>
          <div class="plan-name" x-text="plan.name"></div>
          <div class="plan-desc" x-text="plan.description || 'Includes classes, AI tools, and community access.'"></div>
          <div class="price-amount">
            <span x-text="'Rs.' + Math.round((billing === 'annual' ? plan.price_annual_paise : plan.price_monthly_paise) / 100)"></span>
            <small x-text="billing === 'annual' ? '/yr' : '/mo'"></small>
          </div>
          <div class="price-annual" x-show="billing === 'monthly' && plan.price_annual_paise > 0" x-text="'Rs.' + Math.round(plan.price_annual_paise / 100) + ' if billed yearly'"></div>
          <div class="plan-divider"></div>
          <ul class="plan-features">
            <template x-for="feature in (plan.features || [])" :key="feature">
              <li><span class="feat-icon">*</span><span x-text="feature"></span></li>
            </template>
          </ul>
        </div>
      </template>
    </div>

    <div class="actions" x-show="!loading && !error && plans.length">
      <button
        class="pay-btn"
        :disabled="processing || !selectedPlanId || isCurrentSelected()"
        @click="startPayment()"
        x-text="processing ? 'Redirecting...' : (isCurrentSelected() ? 'Current plan selected' : 'Continue to Payment')">
      </button>
      <button
        class="cancel-btn"
        x-show="currentSubscription?.is_subscribed"
        :disabled="processing || currentSubscription?.cancel_at_period_end"
        @click="cancelSubscription()"
        x-text="currentSubscription?.cancel_at_period_end ? 'Cancellation already scheduled' : 'Cancel at period end'">
      </button>
      <div class="action-msg" x-show="actionMessage" x-text="actionMessage"></div>
      <div class="action-err" x-show="actionError" x-text="actionError"></div>
    </div>
  </div>

  <script>
    function plansData() {
      return {
        billing: 'monthly',
        loading: true,
        error: '',
        plans: [],
        selectedPlanId: null,
        currentSubscription: null,
        processing: false,
        actionMessage: '',
        actionError: '',
        isCurrentPlan(plan) {
          if (!this.currentSubscription?.is_subscribed || !plan) return false;
          const mineSlug = (this.currentSubscription.plan_slug || '').toLowerCase().trim();
          const mineName = (this.currentSubscription.plan_name || '').toLowerCase().trim();
          const slug = (plan.slug || '').toLowerCase().trim();
          const name = (plan.name || '').toLowerCase().trim();
          return (mineSlug && slug && mineSlug === slug) || (mineName && name && mineName === name);
        },
        isCurrentSelected() {
          const selected = this.plans.find((p) => p.id === this.selectedPlanId);
          return this.isCurrentPlan(selected);
        },
        async startPayment() {
          this.actionMessage = '';
          this.actionError = '';
          const selected = this.plans.find((p) => p.id === this.selectedPlanId);
          if (!selected) {
            this.actionError = 'Please select a plan.';
            return;
          }
          if (this.isCurrentPlan(selected)) {
            this.actionError = 'This plan is already active.';
            return;
          }
          this.processing = true;
          try {
            const order = await TG.Subscriptions.createOrder(selected.id, this.billing);
            const link = (order?.payment_link || '').trim();
            if (!link) throw new Error('No payment link returned from server.');
            this.actionMessage = 'Opening Razorpay checkout...';
            window.location.href = link;
          } catch (e) {
            this.actionError = e?.message || 'Failed to start payment.';
          } finally {
            this.processing = false;
          }
        },
        async cancelSubscription() {
          this.actionMessage = '';
          this.actionError = '';
          if (!this.currentSubscription?.is_subscribed) {
            this.actionError = 'No active subscription found.';
            return;
          }
          if (this.currentSubscription?.cancel_at_period_end) {
            this.actionError = 'Cancellation is already scheduled for period end.';
            return;
          }
          if (!confirm('Cancel subscription at period end? You will keep access until the current period ends.')) {
            return;
          }
          this.processing = true;
          try {
            const res = await TG.Subscriptions.cancel();
            const endDate = res?.current_period_end ? new Date(res.current_period_end).toLocaleDateString('en-IN') : 'period end';
            this.actionMessage = `Cancellation scheduled. Subscription benefits will stop from ${endDate}.`;
            await this.init();
          } catch (e) {
            this.actionError = e?.message || 'Failed to cancel subscription.';
          } finally {
            this.processing = false;
          }
        },
        async init() {
          this.loading = true;
          this.error = '';
          try {
            const [data, mine] = await Promise.all([
              TG.Subscriptions.list(),
              TG.Subscriptions.getMine().catch(() => null)
            ]);
            this.currentSubscription = mine || null;
            this.plans = Array.isArray(data) ? data.filter(p => p.is_active) : [];
            if (!this.plans.length) {
              this.error = 'No active plans found.';
              return;
            }
            const current = this.plans.find((p) => this.isCurrentPlan(p));
            this.selectedPlanId = current?.id || this.plans[0].id;
          } catch (e) {
            this.error = e?.message || 'Failed to fetch plans';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
