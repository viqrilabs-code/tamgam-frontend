<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a Plan — TamGam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/auth.js"></script>
  <style>
    :root {
      --saffron:    #E8640C;
      --saffron-lt: #F5914A;
      --saffron-dk: #C04F06;
      --teal:       #0D5C63;
      --teal-lt:    #1A8A94;
      --ivory:      #FDF6EC;
      --ivory-dk:   #F0E4CC;
      --ink:        #1A1A2E;
      --ink-lt:     #3D3D5C;
      --gold:       #D4A017;
      --gold-lt:    #F0C040;
      --cream:      #FEFBF4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: white;
      min-height: 100vh;
    }

    /* ── Noise texture ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.5;
    }

    /* ── Glow orbs ── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(232,100,12,.12); top: -100px; right: -100px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(13,92,99,.15);   bottom: -80px; left: -80px; }

    /* ── Nav ── */
    nav {
      position: relative; z-index: 10;
      padding: 20px 5vw;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .flame { font-size: 20px; animation: flicker 3s ease-in-out infinite; }
    @keyframes flicker {
      0%,100% { filter: drop-shadow(0 0 8px rgba(232,100,12,.5)); }
      50%      { filter: drop-shadow(0 0 16px rgba(232,100,12,.9)); }
    }
    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem; color: white;
    }
    .nav-brand em { color: var(--saffron-lt); font-style: normal; }
    .nav-back {
      font-size: .85rem; color: rgba(255,255,255,.5);
      text-decoration: none; display: flex; align-items: center; gap: 6px;
      transition: color .2s;
    }
    .nav-back:hover { color: white; }

    /* ── Page ── */
    .page {
      position: relative; z-index: 1;
      padding: 56px 5vw 80px;
      max-width: 1100px; margin: 0 auto;
    }

    /* ── Header ── */
    .page-header { text-align: center; margin-bottom: 48px; }
    .page-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(232,100,12,.15);
      border: 1px solid rgba(232,100,12,.3);
      color: var(--saffron-lt); font-size: .8rem; font-weight: 600;
      padding: 5px 14px; border-radius: 100px; margin-bottom: 20px;
      animation: fadeUp .5s ease both;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.1; margin-bottom: 14px;
      animation: fadeUp .5s .1s ease both;
    }
    .page-title em { font-style: italic; color: var(--saffron-lt); }
    .page-sub {
      font-size: 1rem; color: rgba(255,255,255,.6);
      line-height: 1.7; max-width: 460px; margin: 0 auto;
      animation: fadeUp .5s .2s ease both;
    }

    /* ── Billing toggle ── */
    .billing-toggle {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 44px;
      animation: fadeUp .5s .3s ease both;
    }
    .toggle-label {
      font-size: .9rem; font-weight: 500;
      color: rgba(255,255,255,.5); transition: color .2s;
    }
    .toggle-label.active { color: white; }
    .toggle-track {
      width: 48px; height: 26px; border-radius: 13px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      cursor: pointer; position: relative; transition: background .2s;
    }
    .toggle-track.on { background: var(--saffron); border-color: var(--saffron); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; transition: transform .2s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(22px); }
    .save-pill {
      background: rgba(5,150,105,.2); border: 1px solid rgba(5,150,105,.3);
      color: #6ee7b7; font-size: .72rem; font-weight: 700;
      padding: 3px 8px; border-radius: 6px; letter-spacing: .03em;
    }

    /* ── Plans grid ── */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      animation: fadeUp .5s .4s ease both;
    }

    /* ── Plan card ── */
    .plan-card {
      background: rgba(255,255,255,.04);
      border: 1.5px solid rgba(255,255,255,.08);
      border-radius: 24px; padding: 28px 24px;
      cursor: pointer; transition: all .25s;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .plan-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(232,100,12,.06), transparent);
      opacity: 0; transition: opacity .25s;
    }
    .plan-card:hover {
      border-color: rgba(232,100,12,.35);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0,0,0,.3);
    }
    .plan-card:hover::before { opacity: 1; }
    .plan-card.selected {
      border-color: var(--saffron);
      background: rgba(232,100,12,.08);
      box-shadow: 0 0 0 3px rgba(232,100,12,.15), 0 20px 60px rgba(0,0,0,.3);
    }
    .plan-card.selected::before { opacity: 1; }
    .plan-card.popular {
      border-color: rgba(212,160,23,.4);
    }
    .plan-card.popular.selected {
      border-color: var(--gold);
      background: rgba(212,160,23,.08);
      box-shadow: 0 0 0 3px rgba(212,160,23,.2), 0 20px 60px rgba(0,0,0,.3);
    }

    /* Popular badge */
    .popular-badge {
      position: absolute; top: 16px; right: 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-lt));
      color: var(--ink); font-size: .68rem; font-weight: 800;
      padding: 4px 10px; border-radius: 6px;
      letter-spacing: .05em; text-transform: uppercase;
    }

    /* Selected check */
    .selected-check {
      position: absolute; top: 16px; right: 16px;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--saffron);
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; opacity: 0; transition: opacity .2s;
    }
    .plan-card.selected .selected-check { opacity: 1; }
    .plan-card.popular.selected .selected-check { background: var(--gold); }

    .plan-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; font-weight: 700;
      color: white; margin-bottom: 4px;
    }
    .plan-desc {
      font-size: .8rem; color: rgba(255,255,255,.45);
      line-height: 1.5; margin-bottom: 20px;
      min-height: 48px;
    }

    .plan-price {
      margin-bottom: 6px;
    }
    .price-amount {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem; font-weight: 900;
      line-height: 1; color: white;
    }
    .price-amount small {
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem; font-weight: 400;
      color: rgba(255,255,255,.5);
    }
    .price-annual {
      font-size: .75rem; color: rgba(255,255,255,.4);
      margin-bottom: 20px;
    }
    .price-annual strong { color: #6ee7b7; }

    .plan-divider {
      height: 1px; background: rgba(255,255,255,.07);
      margin-bottom: 18px;
    }

    .plan-features { list-style: none; flex: 1; }
    .plan-features li {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: .83rem; color: rgba(255,255,255,.7);
      padding: 5px 0; line-height: 1.4;
    }
    .feat-icon { font-size: .75rem; margin-top: 2px; flex-shrink: 0; }
    .feat-icon.check { color: var(--saffron-lt); }
    .feat-icon.gold  { color: var(--gold-lt); }

    /* ── CTA section ── */
    .cta-section {
      margin-top: 40px; text-align: center;
      animation: fadeUp .5s .5s ease both;
    }
    .selected-summary {
      display: inline-flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px; padding: 14px 24px;
      margin-bottom: 20px; font-size: .9rem;
    }
    .summary-plan  { font-weight: 700; color: white; }
    .summary-price { color: var(--saffron-lt); font-weight: 600; }
    .summary-sep   { color: rgba(255,255,255,.2); }

    .btn-checkout {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--saffron); color: white;
      padding: 16px 40px; border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem; font-weight: 700;
      border: none; cursor: pointer;
      box-shadow: 0 8px 32px rgba(232,100,12,.35);
      transition: all .2s;
    }
    .btn-checkout:hover:not(:disabled) {
      background: var(--saffron-dk);
      box-shadow: 0 12px 40px rgba(232,100,12,.45);
      transform: translateY(-2px);
    }
    .btn-checkout:disabled {
      opacity: .4; cursor: not-allowed; transform: none;
    }
    .btn-checkout.popular-selected {
      background: linear-gradient(135deg, var(--gold), var(--saffron));
    }

    .checkout-note {
      margin-top: 14px; font-size: .78rem;
      color: rgba(255,255,255,.35);
    }
    .checkout-note a { color: rgba(255,255,255,.5); text-decoration: none; }

    /* ── Free plan strip ── */
    .free-strip {
      margin-top: 32px; text-align: center;
      font-size: .85rem; color: rgba(255,255,255,.35);
    }
    .free-strip a {
      color: rgba(255,255,255,.55); text-decoration: none;
      font-weight: 600; transition: color .2s;
    }
    .free-strip a:hover { color: white; }

    /* ── Loading ── */
    .loading-state {
      text-align: center; padding: 80px 20px;
      color: rgba(255,255,255,.4);
    }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--saffron);
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-state {
      text-align: center; padding: 60px 20px;
      color: rgba(255,255,255,.5);
    }
    .error-icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* ── Razorpay trust ── */
    .trust-row {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; margin-top: 32px; flex-wrap: wrap;
    }
    .trust-item {
      display: flex; align-items: center; gap: 6px;
      font-size: .75rem; color: rgba(255,255,255,.3);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 640px) {
      .plans-grid { grid-template-columns: 1fr; }
      .page { padding: 32px 5vw 60px; }
    }
  </style>
</head>
<body x-data x-init="Guards.requireLogin()">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- ── Nav ── -->
  <nav>
    <a href="/" class="nav-logo">
      <span class="flame"><img src="logo.png" style="width:32px;height:32px;object-fit:contain;" alt="TamGam"></span>
      <span class="nav-brand">Tam<em>Gam</em></span>
    </a>
    <a href="/dashboard.html" class="nav-back">← Back to dashboard</a>
  </nav>

  <!-- ── Page ── -->
  <div class="page" x-data="plansData()">

    <!-- Header -->
    <div class="page-header">
      <div class="page-tag"><img src="logo.png" style="width:32px;height:32px;object-fit:contain;" alt="TamGam"> &nbsp;Unlock the full TamGam</div>
      <h1 class="page-title">Choose your <em>learning</em> plan</h1>
      <p class="page-sub">All plans include live class access, AI notes, adaptive assessments, and Diya — your personal AI tutor.</p>
    </div>

    <!-- Billing toggle -->
    <div class="billing-toggle">
      <span class="toggle-label" :class="{ active: billing === 'monthly' }">Monthly</span>
      <div class="toggle-track" :class="{ on: billing === 'annual' }"
        @click="billing = billing === 'monthly' ? 'annual' : 'monthly'">
        <div class="toggle-thumb"></div>
      </div>
      <span class="toggle-label" :class="{ active: billing === 'annual' }">Annual</span>
      <span class="save-pill" x-show="billing === 'annual'">Save up to 33%</span>
    </div>

    <!-- Loading -->
    <template x-if="loading">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading plans…</p>
      </div>
    </template>

    <!-- Error -->
    <template x-if="!loading && error">
      <div class="error-state">
        <div class="error-icon">⚠️</div>
        <p x-text="error"></p>
      </div>
    </template>

    <!-- Plans grid -->
    <template x-if="!loading && !error && plans.length > 0">
      <div>
        <div class="plans-grid">
          <template x-for="(plan, index) in plans" :key="plan.id">
            <div class="plan-card"
              :class="{
                selected: selectedId === plan.id,
                popular:  isPopular(plan, index),
              }"
              @click="selectedId = plan.id"
            >
              <!-- Popular badge -->
              <template x-if="isPopular(plan, index) && selectedId !== plan.id">
                <div class="popular-badge">⭐ Popular</div>
              </template>

              <!-- Selected check -->
              <div class="selected-check">✓</div>

              <div class="plan-name" x-text="plan.name"></div>
              <div class="plan-desc" x-text="plan.description"></div>

              <div class="plan-price">
                <div class="price-amount">
                  <span x-text="displayPrice(plan)"></span>
                  <small x-text="billing === 'annual' ? '/yr' : '/mo'"></small>
                </div>
              </div>

              <div class="price-annual" x-show="billing === 'annual' && savingPct(plan) > 0">
                <strong x-text="'Save ' + savingPct(plan) + '%'"></strong>
                vs monthly
              </div>
              <div class="price-annual" x-show="billing === 'monthly'">
                <span x-text="'₹' + (plan.price_annual_paise/100).toLocaleString('en-IN') + '/yr if billed annually'"></span>
              </div>

              <div class="plan-divider"></div>

              <ul class="plan-features">
                <template x-for="feat in plan.features" :key="feat">
                  <li>
                    <span class="feat-icon" :class="isPopular(plan, index) ? 'gold' : 'check'">✦</span>
                    <span x-text="feat"></span>
                  </li>
                </template>
                <li x-show="plan.subjects_allowed > 0">
                  <span class="feat-icon check">✦</span>
                  <span x-text="plan.subjects_allowed + (plan.subjects_allowed === 1 ? ' subject' : ' subjects')"></span>
                </li>
                <li x-show="plan.subjects_allowed === -1">
                  <span class="feat-icon gold">✦</span>
                  <span>Unlimited subjects</span>
                </li>
              </ul>
            </div>
          </template>
        </div>

        <!-- CTA -->
        <div class="cta-section">
          <template x-if="selected">
            <div>
              <div class="selected-summary">
                <span class="summary-plan" x-text="selected.name"></span>
                <span class="summary-sep">·</span>
                <span x-text="billing === 'annual' ? 'Annual billing' : 'Monthly billing'"></span>
                <span class="summary-sep">·</span>
                <span class="summary-price" x-text="selectedPrice + selectedPeriodLabel"></span>
              </div>
              <br/>
              <button class="btn-checkout"
                :class="{ 'popular-selected': isPopular(selected, plans.indexOf(selected)) }"
                @click="checkout"
                :disabled="processing"
              >
                <span x-show="!processing">Continue to payment →</span>
                <span x-show="processing" style="display:flex;align-items:center;gap:8px;">
                  <span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:white;animation:spin .6s linear infinite;display:inline-block;"></span>
                  Processing…
                </span>
              </button>
            </div>
          </template>

          <p class="checkout-note">
            Secured by Razorpay · Cancel anytime · No hidden charges
          </p>

          <div class="trust-row">
            <div class="trust-item">🔒 256-bit SSL</div>
            <div class="trust-item">💳 All Indian cards accepted</div>
            <div class="trust-item">🏦 UPI / Net banking / Wallets</div>
            <div class="trust-item">↩️ Cancel anytime</div>
          </div>
        </div>

        <div class="free-strip">
          Want to try before subscribing? <a href="/dashboard.html">Continue with free plan →</a>
        </div>

      </div>
    </template>

    <!-- No plans -->
    <template x-if="!loading && !error && plans.length === 0">
      <div class="error-state">
        <div class="error-icon">📋</div>
        <p>No plans configured yet. Ask your admin to set up subscription plans.</p>
      </div>
    </template>

  </div>

<script>
function plansData() {
  return {
    plans: [],
    loading: true,
    error: null,
    billing: 'monthly',
    selectedId: null,
    processing: false,

    async init() {
      Guards.requireLogin();
      try {
        const data = await TG.Subscriptions.list();
        this.plans = (Array.isArray(data) ? data : []).filter(p => p.price_monthly_paise > 0 && p.is_active);
        if (this.plans.length >= 2) this.selectedId = this.plans[1].id;
        else if (this.plans.length === 1) this.selectedId = this.plans[0].id;
      } catch(e) {
        this.error = e.message || 'Could not load plans.';
      }
      this.loading = false;
    },

    get selected() {
      return this.plans.find(p => p.id === this.selectedId) || null;
    },

    get selectedPrice() {
      if (!this.selected) return '';
      const paise = this.billing === 'annual'
        ? this.selected.price_annual_paise
        : this.selected.price_monthly_paise;
      return '\u20b9' + (paise / 100).toLocaleString('en-IN');
    },

    get selectedPeriodLabel() {
      return this.billing === 'annual' ? '/year' : '/month';
    },

    savingPct(plan) {
      const monthlyTotal = plan.price_monthly_paise * 12;
      const annual = plan.price_annual_paise;
      if (!annual || !monthlyTotal) return 0;
      return Math.round((monthlyTotal - annual) / monthlyTotal * 100);
    },

    displayPrice(plan) {
      const paise = this.billing === 'annual'
        ? plan.price_annual_paise
        : plan.price_monthly_paise;
      return '\u20b9' + (paise / 100).toLocaleString('en-IN');
    },

    isPopular(plan, index) {
      return index === 1;
    },

    async checkout() {
      if (!this.selected || this.processing) return;
      this.processing = true;
      try {
        const order = await TG.Subscriptions.createOrder(this.selected.id, this.billing);
        if (!order) throw new Error('No order returned from server.');

        if (typeof Razorpay === 'undefined' || !window.RAZORPAY_KEY_ID) {
          alert(
            'Razorpay key not set.\n\n' +
            'Add this to the top of shared/api.js:\n' +
            "window.RAZORPAY_KEY_ID = 'rzp_test_xxxxxxxxxxxxxxxx';\n\n" +
            'Order created:\n' + JSON.stringify(order, null, 2)
          );
          this.processing = false;
          return;
        }

        const rzp = new Razorpay({
          key: window.RAZORPAY_KEY_ID,
          subscription_id: order.razorpay_subscription_id,
          name: 'TamGam',
          description: this.selected.name + ' — ' + this.billing,
          theme: { color: '#E8640C' },
          prefill: { name: TG.TokenStore.getUser()?.full_name || '' },
          handler: () => {
            window.location.href = '/dashboard.html?subscribed=1';
          },
          modal: {
            ondismiss: () => { this.processing = false; }
          }
        });
        rzp.open();

      } catch(e) {
        alert(e.message || 'Could not start checkout. Please try again.');
        this.processing = false;
      }
    },
  };
}
</script>
</body>
</html>
